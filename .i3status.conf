general {
    colors = true
    interval = 1
    output_format = i3bar
    color_good = "#2267a5"
    color_degraded = "#8c7f22"
    color_bad = "#be2422"
}

order += "wireless _first_"
order += "battery 0"
order += "volume master"
order += "tztime local"

tztime local {
    format = " %d/%m/%y %H:%M "
}

volume master {
    format = " Vol: %volume "
    device = "default"
    mixer = "Master"
    mixer_idx = 0
}

wireless _first_ {
    format_up = " W: %essid (%quality) %ip "
    format_down = " W: down "
}

battery 0 {
    # Non-breaking spaces (U+00A0) below: the battery module trims regular
    # leading/trailing spaces, which made this block look inconsistent with the
    # others.
    format = " %status %percentage %remaining "
    format_down = " No battery "
    status_chr = "CHR"
    status_bat = "BAT"
    status_unk = "UNK"
    status_full = "FULL"
    path = "/sys/class/power_supply/BAT%d/uevent"
    low_threshold = 10
    threshold_type = percentage
    integer_battery_capacity = true
    last_full_capacity = true
}
